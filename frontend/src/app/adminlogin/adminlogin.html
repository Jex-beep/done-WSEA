<app-nav></app-nav>

<main class="login-page">
  <div class="login-card">
    <h1 class="login-title">Staff sign in</h1>
    <p class="login-subtitle">Management access for the showroom team.</p>

    <form (submit)="onLogin()" novalidate>
      <div class="form-field">
        <label for="admin-username">Username</label>
        <input
          id="admin-username"
          type="text"
          [(ngModel)]="loginData.username"
          name="username"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required>
      </div>

      <div class="form-field">
        <label for="admin-password">Password</label>
        <div class="password-wrapper">
          <input
            id="admin-password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="loginData.password"
            name="password"
            autocomplete="current-password"
            required>
          <button
            type="button"
            class="toggle-btn"
            (click)="togglePasswordVisibility()"
            [attr.aria-pressed]="showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <div class="login-alert" role="alert" [hidden]="!errorMessage">
        @if (errorMessage) {
          <strong>Couldn't sign in.</strong> {{ errorMessage }}
        }
      </div>

      <button type="submit" class="btn-login" [disabled]="isLoading">
        {{ isLoading ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="login-footer">
      <a routerLink="/">← Back to the showroom</a>
    </p>
  </div>
</main>
