<nav class="navbar" aria-label="Main">
  <div class="logo-container">
    <a routerLink="/" (click)="closeMenu()" aria-label="M&J Quality Used Cars home">
      <img src="/MJlogo.webp" alt="" class="logo">
    </a>
  </div>

  <button
    type="button"
    class="menu-toggle"
    [class.open]="menuActive"
    [attr.aria-expanded]="menuActive"
    aria-controls="primary-menu"
    aria-label="Toggle navigation menu"
    (click)="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <ul id="primary-menu" class="nav-links" [class.mobile-open]="menuActive">
    <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a></li>
    <li><a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a></li>
    <li><a routerLink="/products" routerLinkActive="active" (click)="closeMenu()">Products</a></li>
    <li><a routerLink="/blog" routerLinkActive="active" (click)="closeMenu()">Blogs</a></li>
    <li><a routerLink="/contact" class="nav-cta" (click)="closeMenu()">Contact us</a></li>

    @if (authService.isLoggedIn()) {
      <li class="admin-only-item">
        <button
          type="button"
          class="logout-btn"
          (click)="authService.logout(); closeMenu()">
          Log out
        </button>
      </li>
    }
  </ul>
</nav>
